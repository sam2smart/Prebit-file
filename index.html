<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prebid.js Header Bidding Site</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Google Ad Manager, and it enables website publishers to manage and display advertisements on their websites effectively -->
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>

  <!-- Prebid.js, a popular open-source header bidding solution for web publishers -->
  <script src="https://cdn.jsdelivr.net/npm/prebid.js@latest"></script>

  <script src="js/prebid-config.js" defer></script> <!-- the configuration banner and icons are managered. -->
  <script src="js/lazyload.js" defer></script> <!-- Load ads only when in view. -->
  <script src="js/analytics.js" defer></script> <!-- Track bids, win rates, and latency using Google Analytics. -->
  <script src="js/error-handler.js" defer></script> <!-- Log and handle errors when bids fail or timeout. -->
</head>
<body>
  <header>
    <h1>Working on Prebid.js Optimized Ad System Project</h1>
  </header>

  <main>
    <!-- Responsive Banner Ad -->
    <div class="ad-container">
      <h2>Banner Ad 1 (Desktop and Mobile)</h2>
      <div id="ad-slot-1" class="ad-slot"></div>
    </div>

    <div class="ad-container">
      <h2>Banner Ad 2 (Wide Banner)</h2>
      <div id="ad-slot-2" class="ad-slot"></div>
    </div>
  </main>


</body>
</html>
